# ==============================================================================
# WeatherPulse Backend — Application Configuration Template (application-example.properties)
# ==============================================================================
# Copy this file to application.properties or application-local.properties.
# NEVER commit production passwords, live API keys, or JWT secrets to version control.

# Server Configuration
server.port=8080
server.servlet.context-path=/

# ------------------------------------------------------------------------------
# PostgreSQL Database Configuration
# ------------------------------------------------------------------------------
# Can be overridden via environment variables: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/weatherpulse_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_postgres_password_here}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------------------------------------------
# Redis Distributed Cache Configuration
# ------------------------------------------------------------------------------
# Can be overridden via environment variables: SPRING_DATA_REDIS_HOST, SPRING_DATA_REDIS_PORT, SPRING_DATA_REDIS_PASSWORD
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# WeatherPulse Cache TTL Configuration (Default: 10 minutes = 600000 ms)
weatherpulse.cache.ttl-ms=600000

# ------------------------------------------------------------------------------
# Proactive Background Scheduler Configuration
# ------------------------------------------------------------------------------
# Background refresh interval in milliseconds (Default: 5 minutes = 300000 ms)
weatherpulse.scheduler.refresh-interval-ms=300000

# ------------------------------------------------------------------------------
# OpenWeatherMap External API Configuration
# ------------------------------------------------------------------------------
# Can be overridden via environment variable: WEATHERPULSE_OPENWEATHER_API_KEY
weatherpulse.external-api.base-url=${WEATHERPULSE_OPENWEATHER_BASE_URL:https://api.openweathermap.org/data/2.5}
weatherpulse.external-api.api-key=${WEATHERPULSE_OPENWEATHER_API_KEY:your_openweathermap_api_key_here}
weatherpulse.external-api.connect-timeout-ms=3000
weatherpulse.external-api.read-timeout-ms=5000

# ------------------------------------------------------------------------------
# JWT Security Configuration (Stateless Admin Authorization)
# ------------------------------------------------------------------------------
# Cryptographically secure 256-bit (minimum 32 characters / 64 hex characters) secret key
# Can be overridden via environment variable: WEATHERPULSE_JWT_SECRET
weatherpulse.jwt.secret=${WEATHERPULSE_JWT_SECRET:your_base64_or_hex_encoded_256_bit_jwt_secret_key_minimum_32_bytes}
# Token Expiration Duration (Default: 2 hours = 7200000 ms)
weatherpulse.jwt.expiration-ms=7200000
weatherpulse.jwt.issuer=weatherpulse-auth-service
