# ==============================================================================
# WeatherPulse Backend Application Configuration
# ==============================================================================
# All secrets and environment-dependent properties are parameterized via
# environment variables with sensible defaults for local development.
# In production, provide these values via container env vars or a secrets vault.

# Application Server
server.port=8080
server.servlet.context-path=/

# ------------------------------------------------------------------------------
# PostgreSQL Database Configuration
# ------------------------------------------------------------------------------
# Externalized via: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/weatherpulse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------------------------------------------
# Redis Distributed Cache Configuration
# ------------------------------------------------------------------------------
# Externalized via: SPRING_DATA_REDIS_HOST, SPRING_DATA_REDIS_PORT, SPRING_DATA_REDIS_PASSWORD
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# WeatherPulse Cache TTL (Default: 10 minutes = 600,000 ms)
weatherpulse.cache.ttl-ms=600000

# ------------------------------------------------------------------------------
# Background Refresh Scheduler Configuration
# ------------------------------------------------------------------------------
# Refresh interval in milliseconds (Default: 5 minutes = 300,000 ms)
weatherpulse.scheduler.refresh-interval-ms=300000

# ------------------------------------------------------------------------------
# OpenWeatherMap External API Configuration
# ------------------------------------------------------------------------------
# Externalized via: WEATHERPULSE_OPENWEATHER_API_KEY
weatherpulse.external-api.base-url=${WEATHERPULSE_OPENWEATHER_BASE_URL:https://api.openweathermap.org/data/2.5}
weatherpulse.external-api.api-key=${WEATHERPULSE_OPENWEATHER_API_KEY:demo_openweather_api_key}
weatherpulse.external-api.connect-timeout-ms=3000
weatherpulse.external-api.read-timeout-ms=5000

# ------------------------------------------------------------------------------
# JWT Security Configuration (Admin Stateless Authorization)
# ------------------------------------------------------------------------------
# Externalized via: WEATHERPULSE_JWT_SECRET (must be >= 256 bits)
weatherpulse.jwt.secret=${WEATHERPULSE_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
weatherpulse.jwt.expiration-ms=${WEATHERPULSE_JWT_EXPIRATION_MS:7200000}
weatherpulse.jwt.issuer=weatherpulse-auth-service
